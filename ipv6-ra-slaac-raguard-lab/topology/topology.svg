<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'Segoe UI', Roboto, -apple-system, system-ui, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="12" y="12" width="736" height="576" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- title -->
  <text x="380" y="50" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2328">Topologie du laboratoire</text>
  <text x="380" y="72" text-anchor="middle" font-size="12.5" fill="#656d76">Réseau IPv6 isolé — GNS3 / VirtualBox</text>

  <!-- links (drawn under the boxes) -->
  <!-- R1 <-> SW1 : autorisé -->
  <line x1="380" y1="184" x2="380" y2="278" stroke="#1a7f37" stroke-width="2.5"/>
  <!-- SW1 <-> Victime -->
  <line x1="336" y1="358" x2="204" y2="462" stroke="#656d76" stroke-width="2"/>
  <!-- SW1 <-> Kali -->
  <line x1="424" y1="358" x2="556" y2="462" stroke="#cf222e" stroke-width="2"/>

  <!-- port labels -->
  <text x="392" y="204" font-size="10.5" fill="#57606a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Gi0/0</text>
  <text x="392" y="270" font-size="10.5" fill="#57606a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Gi0/1</text>
  <text x="300" y="398" font-size="10.5" fill="#57606a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Gi0/2</text>
  <text x="458" y="398" font-size="10.5" fill="#57606a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Gi0/3</text>

  <!-- link badges -->
  <g>
    <rect x="326" y="220" width="108" height="23" rx="11.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
    <text x="380" y="236" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a7f37">RA autorisés</text>
  </g>
  <g>
    <rect x="200" y="399" width="96" height="23" rx="11.5" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/>
    <text x="248" y="415" text-anchor="middle" font-size="11.5" font-weight="600" fill="#cf222e">RA bloqués</text>
  </g>
  <g>
    <rect x="462" y="399" width="96" height="23" rx="11.5" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/>
    <text x="510" y="415" text-anchor="middle" font-size="11.5" font-weight="600" fill="#cf222e">RA bloqués</text>
  </g>

  <!-- R1 -->
  <rect x="300" y="108" width="160" height="76" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0a3069">R1</text>
  <text x="380" y="164" text-anchor="middle" font-size="12" fill="#0969da">Routeur légitime</text>
  <text x="476" y="140" font-size="11.5" fill="#57606a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2001:DB8:10::1/64</text>
  <text x="476" y="158" font-size="11.5" fill="#57606a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">FE80::1</text>

  <!-- SW1 -->
  <rect x="288" y="278" width="184" height="80" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="308" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">SW1</text>
  <rect x="336" y="320" width="88" height="23" rx="11.5" fill="#1a7f37"/>
  <text x="380" y="336" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">RA Guard</text>

  <!-- Victime -->
  <rect x="120" y="462" width="168" height="76" rx="10" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="204" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Victime</text>
  <text x="204" y="517" text-anchor="middle" font-size="12" fill="#656d76">SLAAC (auto)</text>

  <!-- Kali -->
  <rect x="472" y="462" width="168" height="76" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="556" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#82071e">Kali</text>
  <text x="556" y="517" text-anchor="middle" font-size="12" fill="#cf222e">Faux RA · radvd</text>
  <text x="648" y="494" font-size="11.5" fill="#57606a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">FE80::66</text>

  <!-- legend -->
  <line x1="40" y1="566" x2="64" y2="566" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="72" y="570" font-size="11" fill="#57606a">port routeur — RA autorisés</text>
  <line x1="300" y1="566" x2="324" y2="566" stroke="#cf222e" stroke-width="2"/>
  <text x="332" y="570" font-size="11" fill="#57606a">port hôte — RA bloqués par RA Guard</text>
</svg>
