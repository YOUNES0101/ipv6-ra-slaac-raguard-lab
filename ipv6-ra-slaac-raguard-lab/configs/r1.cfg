! =====================================================
! R1 - Routeur legitime
! Annonce le prefixe 2001:DB8:10::/64 via RA (SLAAC)
! A coller en mode configuration sur R1
! =====================================================
enable
configure terminal

ipv6 unicast-routing            ! active IPv6 + emission automatique des RA

interface GigabitEthernet0/0
 description LAN_LAB_IPV6
 ipv6 address FE80::1 link-local
 ipv6 address 2001:DB8:10::1/64
 no shutdown
exit

end

! --- Verifications ---
! show ipv6 interface brief
! show ipv6 interface GigabitEthernet0/0
! show ipv6 route
