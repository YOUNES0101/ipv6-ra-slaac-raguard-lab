# =====================================================
# Experience A : annoncer un prefixe NON autorise
# A placer sur Kali dans /tmp/ra-prefixe.conf
# Lancement :
#   sudo radvd -n -C /tmp/ra-prefixe.conf -p /tmp/radvd-prefixe.pid
# Adapter "eth0" au nom reel de l'interface Kali.
# =====================================================
interface eth0 {
    AdvSendAdvert on;
    MinRtrAdvInterval 3;
    MaxRtrAdvInterval 10;
    AdvDefaultLifetime 0;          # Kali n'est PAS routeur par defaut ici
    prefix 2001:db8:66::/64 {
        AdvOnLink on;              # le prefixe correspond au lien local
        AdvAutonomous on;          # autorise le SLAAC avec ce prefixe
        AdvValidLifetime 600;      # prefixe valide 600 s
        AdvPreferredLifetime 300;  # adresse preferee 300 s
    };
};
