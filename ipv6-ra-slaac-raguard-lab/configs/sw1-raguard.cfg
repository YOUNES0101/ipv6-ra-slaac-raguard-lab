! =====================================================
! SW1 - RA Guard (IPv6 First-Hop Security)
! Autorise les RA sur le port de R1, les bloque sur les
! ports hotes (victime et Kali).
! Necessite une image IOS/IOS XE compatible FHS.
! =====================================================
enable
configure terminal

! --- Politiques ---
ipv6 nd raguard policy RA-ROUTER
 device-role router
exit

ipv6 nd raguard policy RA-HOST
 device-role host
exit

! --- Port vers le routeur legitime : RA autorises ---
interface GigabitEthernet0/1
 description VERS_R1
 ipv6 nd raguard attach-policy RA-ROUTER
exit

! --- Port vers la victime : RA bloques ---
interface GigabitEthernet0/2
 description VERS_VICTIME
 ipv6 nd raguard attach-policy RA-HOST
exit

! --- Port vers Kali : RA bloques ---
interface GigabitEthernet0/3
 description VERS_KALI
 ipv6 nd raguard attach-policy RA-HOST
exit

end

! --- Verifications ---
! show ipv6 nd raguard policy
! show running-config interface GigabitEthernet0/1
! show running-config interface GigabitEthernet0/3
